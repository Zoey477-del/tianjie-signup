<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞羽品牌头图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;display:flex;justify-content:center;padding:20px}
.banner{
  width:750px;height:300px;
  background:linear-gradient(135deg,#0d0d1a 0%,#1a0a2e 50%,#0a1628 100%);
  border-radius:12px;
  position:relative;overflow:hidden;
  display:flex;align-items:center;
  padding:0 40px;
  gap:30px;
}
.bg-glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.12;pointer-events:none}
.bg-glow-1{width:300px;height:300px;top:-80px;right:-50px;background:#c8a95e}
.bg-glow-2{width:200px;height:200px;bottom:-50px;left:100px;background:#4a90d9}
.content{position:relative;z-index:2;display:flex;flex-direction:column;gap:6px;flex:1}
.brand{font-size:36px;font-weight:900;color:#fff;letter-spacing:4px}
.brand span{color:#c8a95e}
.sub{font-size:13px;color:rgba(200,169,94,0.7);letter-spacing:6px;margin-top:2px}
.venues{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.venue-tag{background:rgba(200,169,94,0.12);border:1px solid rgba(200,169,94,0.3);border-radius:4px;padding:3px 8px;font-size:11px;color:rgba(200,169,94,0.85);letter-spacing:1px}
.slogan{font-size:16px;font-weight:700;color:#e8d48b;letter-spacing:3px;margin-top:8px;text-shadow:0 0 20px rgba(200,169,94,0.3)}
.right-panel{position:relative;z-index:2;text-align:center;min-width:180px}
.offer-box{background:rgba(220,38,38,0.12);border:1.5px solid rgba(220,38,38,0.4);border-radius:10px;padding:14px 18px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0.2)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.offer-box .free{font-size:28px;font-weight:900;color:#ef4444;letter-spacing:2px}
.offer-box .hint{font-size:11px;color:rgba(255,255,255,0.6);margin-top:4px;letter-spacing:1px}
.qr-placeholder{margin-top:10px;width:70px;height:70px;background:rgba(255,255,255,0.9);border-radius:6px;margin-left:auto;margin-right:auto;display:flex;align-items:center;justify-content:center;font-size:9px;color:#333;text-align:center;line-height:1.2}
</style>
</head>
<body>
<div class="banner">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="content">
    <div class="brand">飞羽<span>·</span>球馆</div>
    <div class="sub">FEIYU BADMINTON</div>
    <div class="venues">
      <span class="venue-tag">龙华旗舰店</span>
      <span class="venue-tag">壹方天地馆</span>
      <span class="venue-tag">红山6979馆</span>
      <span class="venue-tag">民治优城馆</span>
      <span class="venue-tag">福田八卦岭馆</span>
      <span class="venue-tag">南山欧洲城馆</span>
    </div>
    <div class="slogan">🏸 羽众不同 · 羽乐共享</div>
  </div>
  <div class="right-panel">
    <div class="offer-box">
      <div class="free">免费体验</div>
      <div class="hint">羽毛球 / 游泳</div>
    </div>
    <div class="qr-placeholder">扫码关注<br>飞羽球馆</div>
  </div>
</div>
</body>
</html>
